# Auto-build: jab bhi games.json / config.json badlo, ye saare pages + sitemap dobara bana deta hai.
name: Build game pages
on:
  push:
    branches: [main]
    paths: ["games.json", "config.json", "tools/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.mjs
      - name: Commit built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build pages from games.json"
          git push
